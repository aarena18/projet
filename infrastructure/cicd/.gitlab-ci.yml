serverless-projet-prd:
  image: node:20
  stage: deploy
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - node --version
    - npm --version
  script:
    - cd api/my-app
    - npm install
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: prd
  after_script:
    - echo "Déploiement PRD USER terminé"


