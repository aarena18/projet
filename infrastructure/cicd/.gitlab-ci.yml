stages:
- deploy

serverless-projet-assets:
  image: python:3.8
  stage: deploy
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apt-get update -y
    - pip3 install boto3
  script:
    - python3.8 infrastructure/scripts/deploy.folder.py serverless_projet_assets
  only:
    refs:
      - stg
      - prd

serverless-projet-stg:
  image: python:3.8
  stage: deploy
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apt-get update -y
    - pip3 install boto3
  script:
    - python3.8 infrastructure/scripts/deploy.front.py serverless_projet_user
  only:
    refs:
      - stg

serverless-projet-prd:
  image: python:3.8
