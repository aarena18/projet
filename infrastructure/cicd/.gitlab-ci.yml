stages:
  - deploy

serverless-projet-assets:
  image: python:3.10
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apt-get update -y
    - apt-get install -y npm
    - python -m pip install --upgrade pip
    - pip install boto3 python-dotenv
    - node --version
    - npm --version
    - python --version
  script:
    - python infrastructure/scripts/deploy.folder.py serverless_projet_assets
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg"'
    - if: '$CI_COMMIT_BRANCH == "main"'

serverless-projet-stg:
  image: python:3.10
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apt-get update -y
    - apt-get install -y npm
    - python -m pip install --upgrade pip
    - pip install boto3 python-dotenv
    - node --version
    - npm --version
    - python --version
  script:
    - cd code/api/my-app
    - npm install
    - python infrastructure/scripts/deploy.front.py serverless_projet_stg
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg"'
  environment:
    name: stg
  after_script:
    - echo "Déploiement STG USER terminé"

