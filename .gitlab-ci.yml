# ─── MIGRATIONS ──────────────────────────────────────────

deploy-migrations-stg:
  stage: deploy
  image: ubuntu:22.04
  only:
    - stg-ambre
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client python3-pip
    - pip install awscli --quiet
  script:
    - for file in $(ls code/database/migration/*.sql | sort); do
      echo "Migration $file...";
      psql "$DATABASE_URL_STG" -f "$file";
      done
