# ─── FRONT USER ──────────────────────────────────────────

build-front-user:
  stage: build
  image: node:20
  only:
    - stg-ambre
    - main
  script:
    - cd code/serverless_projet_user
    - npm install
    - npm run build
  artifacts:
    paths:
      - code/serverless_projet_user/dist/
    expire_in: 1 hour

deploy-front-user-stg:
  stage: deploy
  image: python:3.11
  only:
    - stg-ambre
  needs:
    - build-front-user
  before_script:
    - pip install awscli --quiet
  script:
    - aws s3 sync code/serverless_projet_user/dist/ s3://serverless-projet-www-user-stg --delete --region eu-west-3
    - aws cloudfront create-invalidation --distribution-id E2ZO4QXW2I9QE7 --paths "/*"

deploy-front-user-prd:
  stage: deploy
  image: python:3.11
  only:
    - main
  needs:
    - build-front-user
  when: manual
  before_script:
    - pip install awscli --quiet
  script:
    - aws s3 sync code/serverless_projet_user/dist/ s3://serverless-projet-www-user-prd --delete --region eu-west-3
    - aws cloudfront create-invalidation --distribution-id CF_USER_PRD_ID --paths "/*"

