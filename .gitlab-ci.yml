stages:
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: eu-west-3

# ─── API ─────────────────────────────────────────────────

build-api:
  stage: build
  image: node:20
  only:
    - stg-ambre
    - main
  script:
    - cd code/api/my-app
    - npm install
    - npm run build
    - npm run zip
  artifacts:
    paths:
      - code/api/my-app/lambda.zip
    expire_in: 1 hour

deploy-api-stg:
  stage: deploy
  image: python:3.11
  only:
    - stg-ambre
  needs:
    - build-api
  before_script:
    - pip install awscli --quiet
  script:
    - aws lambda update-function-code
      --function-name serverless-projet-api-stg
      --zip-file fileb://code/api/my-app/lambda.zip
      --region eu-west-3

deploy-api-prd:
  stage: deploy
  image: python:3.11
  only:
    - main
  needs:
    - build-api
  when: manual
  before_script:
    - pip install awscli --quiet
  script:
    - aws lambda update-function-code
      --function-name serverless-projet-api-prd
      --zip-file fileb://code/api/my-app/lambda.zip
      --region eu-west-3

