stages:
  - lint
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: eu-west-3

# ─── LINT ────────────────────────────────────────────────

eslint:
  stage: lint
  image: node:20
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - node --version
    - npm --version
  script:
    - echo "=== Lint front user ==="
    - cd $CI_PROJECT_DIR/code/serverless_projet_user
    - npm ci
    - npx eslint . --max-warnings=0
    - echo "=== Lint front admin ==="
    - cd $CI_PROJECT_DIR/code/serverless_projet_admin
    - npm ci
    - npx eslint . --max-warnings=0
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg-ambre"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  after_script:
    - echo "ESLint terminé"

# ─── BUILD API ───────────────────────────────────────────

build-api:
  stage: build
  image: node:20
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - node --version
    - npm --version
  script:
    - cd $CI_PROJECT_DIR/code/api/my-app
    - npm ci
    - npm run build
    - npm run zip
  artifacts:
    paths:
      - code/api/my-app/lambda.zip
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg-ambre"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── BUILD CRON ──────────────────────────────────────────

build-cron:
  stage: build
  image: node:20
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - node --version
    - npm --version
  script:
    - cd $CI_PROJECT_DIR/code/crons
    - npm ci
    - npm run build
    - npm run zip
  artifacts:
    paths:
      - code/crons/backup.zip
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg-ambre"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── DEPLOY ASSETS S3 ────────────────────────────────────

serverless-projet-assets:
  stage: deploy
  image: python:3.10
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apt-get update -y
    - apt-get install -y npm
    - python -m pip install --upgrade pip
    - pip install boto3 python-dotenv
    - node --version
    - npm --version
    - python --version
  script:
    - python $CI_PROJECT_DIR/infrastructure/scripts/deploy.folder.py assets
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg-ambre"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── DEPLOY API ──────────────────────────────────────────

deploy-api-stg:
  stage: deploy
  image: python:3.10
  variables:
    GIT_STRATEGY: fetch
  needs:
    - build-api
  before_script:
    - apt-get update -y
    - python -m pip install --upgrade pip
    - pip install awscli --quiet
  script:
    - python $CI_PROJECT_DIR/infrastructure/scripts/deploy.api.py stg
  rules:
    - if: '$CI_COMMIT_BRANCH == "stg-ambre"'
  after_script:
    - echo "Déploiement API STG terminé"

deploy-api-prd:
  stage: deploy
  image: python:3.10
  variables:
    GIT_STRATEGY: fetch
  needs:
    - build-api
  when: manual
  before_script:
    - apt-get update -y
    - python -m pip install --upgrade pip
    - pip install awscli --quiet
  script:
    - python $CI_PROJECT_DIR/infrastructure/scripts/deploy.api.py prd
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  after_script:
    - echo "Déploiement API PRD terminé"

# ─── DEPLOY CRON ─────────────────────────────────────────

deploy-cron-stg:
